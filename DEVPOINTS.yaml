# What can be added to scQC. Read by `sch dev map`; see the harness's sch/dev/points.py.
tool: scqc
devpoints: 1
# The word list this repository must not contain lives OUTSIDE it, in the project that owns
# the cohort: $SCQC_FORBIDDEN_TERMS, the convention tests/test_portability.py already uses.
# A tool that ships the vocabulary in order to check that it does not ship the vocabulary
# has shipped it.

tests:
  command: ["{python}", "scqc_cli.py", "selftest"]

# scQC consumes a PROJECT - a samplesheet and per-sample matrices - not a single object, so this
# ran `describe` and the fixture never reached a step (harness autodev W020, B1-041). `fixture-run`
# splits the fixture's object into the project scQC reads - one matrix per library from the counts
# layer it is TOLD, grouped by the sample column it is TOLD, the design table's columns under their
# own names - and runs the real pipeline on it: apply mode, local executor, the stand-in doublet
# detector (tests/fixtures/fake_rscript.py). Both shapes are told their own names and spellings, so
# a step that assumed one would fail the other. It copies the run's STATUS.json to {out}.
fixture:
  command: ["{python}", "scqc_cli.py", "fixture-run", "--observations", "{observations}", "--design", "{design}", "--sample-key", "{role_sample}", "--counts-layer", "{role_counts}", "--mt-prefix", "{mt_prefix}", "--ribo-pattern", "{ribo_pattern}", "--dbr", "0.05", "--jobs", "{jobs}", "--out", "{out}"]
  products: [reports/report.json, STATUS.json]
  # What the run records about its OWN execution, reported by `agree` and never judged: the two
  # shapes are two executions. Everything else the two shapes write is compared.
  execution_record: ["*::*execution_value*", "*::*elapsed*", "*::*seconds*", "*::*duration*", "*::*output_stat*", "*::*mtime*", "*::*bytes*", "*::*size*", "*::*started*", "*::*finished*", "*::*generated*", "*::*newest_input*", "*::*jobs*", "*::*pid*", "*::*hostname*"]

baseline_dir: tests/baselines

points:
  criterion:
    what: a reason a barcode may be set aside, with its own mask and its own threshold
    lives: modules
    register:
      - {file: engine/declare.py, table: CRITERIA}
    # PROSE, DELIBERATELY. A bare identifier here is checked against the artefact at
    # `lives`; a sentence is printed for a person. These requirements are satisfied in
    # other files - the declaration module, the run record - so as checked keys they
    # would look for them where they are not and fail every existing one.
    must_declare: ["one mask of its own in PROVIDES",
                   "a GATES entry carrying the word the module itself writes (as_written)",
                   "what it CANNOT show",
                   "a state_version in the run record it produces"]
    example: light_floor
    tests: [tests/test_status_contract.py, tests/test_describe.py]
    proves: "it declares a mask of its own, a threshold that is written down, and never deletes"
    cannot_prove: >
      that the threshold is right for any cohort but the one it was read from - a criterion is
      calibrated per dataset and a default here would be that calibration escaping

  step:
    what: a stage of the pipeline, run in order over a project
    lives: modules
    register:
      - {file: engine/pipeline.py, table: _STEP_MODULES}
      - {file: engine/declare.py, table: GATES}
    must_declare: [inputs it reads, products it writes, its entry in APPLY_REQUIRES if it removes]
    example: 05_quality
    tests: [tests/test_conditions.py]
    proves: "it is ordered, its products are named, its removals are declared, and the pipeline carries the synthetic fixture - split into a project - through every step to a report"
    cannot_prove: >
      that any threshold is right for a real cohort, or that the doublet calls are - the detector
      on the fixture is a stand-in; a real cohort is shown by reproducing its run

  adapter:
    what: a backend the engine can call for one measurement, swappable without touching a step
    lives: adapters
    must_declare: [what it wraps, its version, whether it is reproducible]
    example: nuclear_fraction
    proves: "it is importable and reports its own reproducibility rather than being assumed"
    cannot_prove: "that two adapters for one measurement agree - that is a comparison, not a check"
